<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Математический квест — 10 быстрых уроков</title>
<style>
  :root{
    --bg1:#eef3ff; --bg2:#fdf2ff; --ink:#232449; --muted:#6b6e93;
    --card:#ffffff; --accent:#6c5ce7; --accent2:#ff7ab6;
    --good:#18a874; --bad:#e0526b; --warn:#f2a93b;
    --shadow:0 12px 30px rgba(60,50,120,.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    background-attachment:fixed;
  }
  .wrap{max-width:960px;margin:0 auto;padding:24px 16px 60px}
  header{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .logo{font-size:34px;line-height:1}
  h1{font-size:clamp(22px,4vw,32px);margin:0;letter-spacing:-.5px}
  .subtitle{color:var(--muted);margin:4px 0 0;font-size:14px}
  .panel{
    background:var(--card);border-radius:24px;padding:24px;box-shadow:var(--shadow);
    border:2px solid rgba(108,92,231,.10);
  }
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .progress-info{font-weight:700;font-size:15px}
  .bar{height:12px;border-radius:99px;background:#ecebfa;overflow:hidden;margin:10px 0 22px}
  .bar > i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .lesson-card{
    text-align:left;cursor:pointer;border:2px solid #efedfb;background:#fff;border-radius:20px;
    padding:16px;min-height:138px;transition:transform .15s,box-shadow .15s,border-color .15s;
    font:inherit;color:inherit;display:flex;flex-direction:column;gap:6px;
  }
  .lesson-card:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(80,60,180,.16);border-color:#cfc7ff}
  .lesson-card:focus-visible,.btn:focus-visible,.choice:focus-visible,input:focus-visible{outline:3px solid #b7aaff;outline-offset:2px}
  .lc-top{display:flex;align-items:center;justify-content:space-between;font-size:30px}
  .lc-num{font-size:13px;font-weight:800;color:var(--accent);background:#f0edff;border-radius:99px;padding:4px 10px}
  .lc-title{font-weight:800;font-size:16px;line-height:1.25}
  .lc-meta{margin-top:auto;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .stars{color:#f5a623;letter-spacing:1px;font-size:14px}
  .badge-done{background:#e6f8f1;color:var(--good);border-radius:99px;padding:3px 9px;font-weight:700;font-size:12px}
  .btn{
    border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),#8b7bff);color:#fff;box-shadow:0 6px 16px rgba(108,92,231,.28);
    transition:transform .12s,filter .12s;
  }
  .btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:#f2f0ff;color:var(--accent);box-shadow:none}
  .btn.small{padding:8px 12px;font-size:13px;border-radius:11px}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .hidden{display:none!important}
  .hint-line{color:var(--muted);font-size:14px;margin-top:18px}
  .reset{margin-top:20px;font-size:12px;color:#9a9ab5;background:none;border:0;cursor:pointer;text-decoration:underline;font-family:inherit}
  /* lesson */
  .lesson-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .lesson-head h2{margin:0;font-size:24px}
  .intro{margin:10px 0 18px;color:#4a4c73;line-height:1.5;background:#f7f6ff;border-left:4px solid var(--accent);padding:12px 14px;border-radius:0 12px 12px 0}
  .timer{font-variant-numeric:tabular-nums;background:#fff4e3;color:#a76b12;border-radius:12px;padding:8px 12px;font-weight:800;white-space:nowrap}
  .timer.late{background:#ffe7ec;color:var(--bad)}
  .dots{display:flex;gap:7px;margin:6px 0 22px}
  .dot{width:12px;height:12px;border-radius:50%;background:#e5e3f5;transition:background .2s,transform .2s}
  .dot.now{background:var(--accent);transform:scale(1.25)}
  .dot.ok{background:var(--good)}
  .qcard{background:linear-gradient(160deg,#fff,#fbfaff);border:2px solid #efedfb;border-radius:20px;padding:22px}
  .qnum{color:var(--accent);font-weight:800;font-size:13px;margin-bottom:8px}
  .question{font-size:clamp(19px,3.2vw,26px);font-weight:800;line-height:1.35;margin-bottom:18px}
  .answer-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=text]{
    font:inherit;font-size:20px;font-weight:700;padding:11px 14px;border:2px solid #dedbf5;
    border-radius:13px;width:min(240px,100%);color:var(--ink);background:#fff;
  }
  .choices{display:flex;gap:10px;flex-wrap:wrap}
  .choice{
    font:inherit;font-weight:800;font-size:18px;padding:10px 20px;border-radius:13px;cursor:pointer;
    border:2px solid #dedbf5;background:#fff;color:var(--ink);
  }
  .choice.selected{border-color:var(--accent);background:#efecff;color:var(--accent)}
  .feedback{min-height:26px;margin-top:16px;font-weight:700;line-height:1.5}
  .feedback.good{color:var(--good)}
  .feedback.bad{color:var(--bad)}
  .explain{margin-top:8px;font-weight:500;color:#4a4c73;font-size:15px;background:#f3fbf8;border-radius:12px;padding:10px 12px}
  .hintbox{margin-top:14px;background:#fff8e8;border:1px dashed var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;color:#8a6415}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
  .backlink{color:var(--muted);background:none;border:0;font:inherit;cursor:pointer;text-decoration:underline;padding:6px}
  /* result */
  .result{text-align:center}
  .result .big{font-size:64px;line-height:1}
  .result h2{font-size:28px;margin:8px 0}
  .result-stars{font-size:40px;letter-spacing:6px;margin:10px 0}
  .stats{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;color:var(--muted);margin:14px 0 22px}
  .stats b{display:block;color:var(--ink);font-size:20px}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:99}
  .confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 2.4s ease-in forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
  @media(max-width:600px){.wrap{padding:16px 12px 40px}.panel{padding:18px}.question{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🧮</div>
    <div>
      <h1>Математический квест</h1>
      <p class="subtitle">10 уроков по 10 минут · арифметика + смекалка</p>
    </div>
  </header>

  <section id="home" class="panel">
    <div class="topbar">
      <div class="progress-info" id="progressText"></div>
      <button class="btn small ghost" id="startNext">Продолжить обучение →</button>
    </div>
    <div class="bar"><i id="progressBar"></i></div>
    <div class="grid" id="grid"></div>
    <p class="hint-line">Нажми на урок → читай подсказку → решай 4–5 заданий. За каждый верный ответ — звезда ⭐. Прогресс сохраняется автоматически.</p>
    <button class="reset" id="resetBtn">Сбросить весь прогресс</button>
  </section>

  <section id="lesson" class="panel hidden">
    <div class="lesson-head">
      <div>
        <h2 id="lessonTitle"></h2>
        <div class="subtitle" id="lessonCounter"></div>
      </div>
      <div class="timer" id="timer">10:00</div>
    </div>
    <p class="intro" id="lessonIntro"></p>
    <div class="dots" id="dots"></div>
    <div class="qcard">
      <div class="qnum" id="qnum"></div>
      <div class="question" id="question"></div>
      <div class="answer-row" id="answerArea"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="actions">
        <button class="btn" id="checkBtn">Проверить</button>
        <button class="btn ghost small" id="hintBtn">💡 Подсказка</button>
        <button class="backlink" id="backBtn">Вернуться к урокам</button>
      </div>
    </div>
  </section>

  <section id="result" class="panel result hidden">
    <div class="big" id="resultIcon">🏆</div>
    <h2 id="resultTitle"></h2>
    <div class="result-stars" id="resultStars"></div>
    <p id="resultText" class="subtitle"></p>
    <div class="stats" id="resultStats"></div>
    <div class="actions" style="justify-content:center">
      <button class="btn" id="nextLessonBtn">Следующий урок →</button>
      <button class="btn ghost" id="homeBtn">К списку уроков</button>
    </div>
  </section>
</div>

<script>
const lessons = [
  {
    id:1, icon:"🔮", title:"Магия девятки",
    intro:"Умножить на 9 проще, чем кажется: умножь на 10 и вычти самое число. Ещё один секрет: сумма цифр ответа при умножении на 9 всегда равна 9!",
    tasks:[
      {q:"9 × 7 = ?", type:"number", answer:63, hint:"9 × 7 — это 70 − 7. Или по пальцам: 7−1=6 десятков, 9−6=3 единицы.", explain:"9 × 7 = 10×7 − 7 = 70 − 7 = 63. Проверка: 6+3=9 ✅"},
      {q:"9 × 8 = ?", type:"number", answer:72, hint:"80 − 8. А ещё 8−1=7 и 9−7=2.", explain:"9 × 8 = 80 − 8 = 72. Проверка: 7+2=9 ✅"},
      {q:"9 × 13 = ?", type:"number", answer:117, hint:"130 − 13 = ?", explain:"9 × 13 = 13×10 − 13 = 130 − 13 = 117. Проверка: 1+1+7=9 ✅"},
      {q:"Сумма цифр любого ответа при умножении на 9 (например, 9 × 6 = 54) равна…", type:"choice", answer:"9", options:["8","9","10"], hint:"5 + 4 = ? Посчитай цифры числа 54.", explain:"54: 5+4=9. Это волшебная проверка девятки!"}
    ]
  },
  {
    id:2, icon:"🍬", title:"Деление без страха",
    intro:"Делить — значит разложить всё поровну. Проверяй ответ наоборот: частное × делитель должно получиться делимое.",
    tasks:[
      {q:"56 : 7 = ?", type:"number", answer:8, hint:"Спроси себя: 7 × ? = 56.", explain:"7 × 8 = 56, значит 56 : 7 = 8."},
      {q:"96 : 8 = ?", type:"number", answer:12, hint:"8 × 10 = 80, осталось 16. Сколько это восьмёрок?", explain:"80 + 16 = 96, то есть 8×10 + 8×2 = 8×12. Ответ 12."},
      {q:"84 тетради разложили по 12 в пачку. Сколько получилось пачек?", type:"number", answer:7, hint:"84 : 12. Прикинь: 12 × 7 ≈ 84?", explain:"12 × 7 = 84, значит пачек 7."},
      {q:"Назови число меньше 20, которое делится и на 3, и на 5.", type:"number", answer:15, hint:"Умножь 3 × 5.", explain:"3 × 5 = 15. Число 15 делится и на 3, и на 5 без остатка."}
    ]
  },
  {
    id:3, icon:"🍕", title:"Дроби на кухне",
    intro:"Дробь — это часть целого. «Четверть от 24» — значит раздели 24 на 4. «Две пятых» — сначала раздели на 5, потом умножь на 2.",
    tasks:[
      {q:"Половина от 18 — это сколько?", type:"number", answer:9, hint:"18 : 2", explain:"18 : 2 = 9. Половина — это одна из двух равных частей."},
      {q:"Четверть от 24 — это сколько?", type:"number", answer:6, hint:"24 : 4", explain:"24 : 4 = 6. Четверть — одна из четырёх равных частей."},
      {q:"Треть от 21 — это сколько?", type:"number", answer:7, hint:"21 : 3", explain:"21 : 3 = 7. Треть — одна из трёх равных частей."},
      {q:"Из 20 кусков пиццы съели 2/5. Сколько кусков съели?", type:"number", answer:8, hint:"Сначала 20 : 5, потом результат × 2.", explain:"Одна пятая = 20:5 = 4 куска. Две пятых = 4×2 = 8 кусков."}
    ]
  },
  {
    id:4, icon:"🔗", title:"Цепочки и закономерности",
    intro:"В цепочке чисел ищи правило: прибавляют одно и то же, умножают или меняется шаг. Проверь правило на всех числах!",
    tasks:[
      {q:"2, 4, 6, 8, … — какое число дальше?", type:"number", answer:10, hint:"Каждый раз прибавляется 2.", explain:"8 + 2 = 10. Это чётные числа."},
      {q:"3, 6, 12, 24, … — дальше?", type:"number", answer:48, hint:"Каждое следующее число в 2 раза больше предыдущего.", explain:"24 × 2 = 48. Здесь правило — умножить на 2."},
      {q:"1, 4, 9, 16, … — дальше?", type:"number", answer:25, hint:"1=1×1, 4=2×2, 9=3×3, 16=4×4.", explain:"Это квадраты чисел: 5×5 = 25."},
      {q:"2, 3, 5, 8, 12, … — дальше?", type:"number", answer:17, hint:"Разности: +1, +2, +3, +4. Что дальше?", explain:"Прибавляем +5: 12 + 5 = 17."}
    ]
  },
  {
    id:5, icon:"🧠", title:"Задачки на смекалку",
    intro:"Здесь важна не скорость, а внимание. Перечитай условие дважды — в таких задачах часто есть ловушка!",
    tasks:[
      {q:"У Оли 3 брата. Сколько сестёр у каждого её брата?", type:"number", answer:1, hint:"Оля — девочка. Она и есть сестра для братьев.", explain:"У каждого брата одна сестра — Оля. Ответ: 1."},
      {q:"5 рыбаков за 5 минут поймали 5 рыб. Сколько рыбаков за 100 минут поймают 100 рыб?", type:"number", answer:5, hint:"Сколько рыб ловит ОДИН рыбак за 5 минут?", explain:"Один рыбак ловит 1 рыбу за 5 минут. За 100 минут он поймает 20 рыб, значит 5 рыбаков поймают 100. Ответ: 5."},
      {q:"Сколько концов у 4 карандашей?", type:"number", answer:8, hint:"У одного карандаша 2 конца.", explain:"4 × 2 = 8 концов. (Остриё — тоже конец!)"},
      {q:"Загадка: число умножили на 2 и прибавили 4 — получили 20. Что за число?", type:"number", answer:8, hint:"Сначала вычти 4 из 20, потом раздели на 2.", explain:"20 − 4 = 16, 16 : 2 = 8. Проверка: 8×2+4 = 20 ✅"}
    ]
  },
  {
    id:6, icon:"⚡", title:"Порядок действий",
    intro:"Правило простое: сначала скобки, потом умножение и деление, и только потом сложение и вычитание. Считай по шагам!",
    tasks:[
      {q:"2 + 3 × 4 = ?", type:"number", answer:14, hint:"Сначала 3 × 4, потом прибавь 2.", explain:"3×4=12, 2+12=14. Без скобок умножение всегда первое."},
      {q:"(2 + 3) × 4 = ?", type:"number", answer:20, hint:"Скобки меняют всё: сначала 2 + 3.", explain:"2+3=5, 5×4=20. Видишь, ответ другой!"},
      {q:"20 − 12 : 3 = ?", type:"number", answer:16, hint:"Сначала 12 : 3.", explain:"12:3=4, 20−4=16."},
      {q:"100 : (5 × 2) = ?", type:"number", answer:10, hint:"В скобках 5 × 2 = 10.", explain:"5×2=10, 100:10=10."}
    ]
  },
  {
    id:7, icon:"💰", title:"Монетки и мерки",
    intro:"Запомни маленькую лесенку: 1 м = 100 см, 1 кг = 1000 г, 1 ч = 60 мин, 1 л = 1000 мл.",
    tasks:[
      {q:"3 часа — это сколько минут?", type:"number", answer:180, hint:"1 час = 60 минут. 60 × 3", explain:"60 × 3 = 180 минут."},
      {q:"2 метра — это сколько сантиметров?", type:"number", answer:200, hint:"1 м = 100 см.", explain:"100 × 2 = 200 см."},
      {q:"Полтора килограмма — сколько это граммов?", type:"number", answer:1500, hint:"1 кг = 1000 г, полкило = 500 г.", explain:"1000 + 500 = 1500 г."},
      {q:"Игрушка стоит 78 ₽. Дали 100 ₽. Сколько сдачи?", type:"number", answer:22, hint:"100 − 78. Досчитай от 78 до 100.", explain:"100 − 78 = 22 ₽. Сдача — 22 рубля."}
    ]
  },
  {
    id:8, icon:"📐", title:"Геометрия вокруг",
    intro:"Периметр — это длина всей границы фигуры (сложи все стороны). Площадь — сколько квадратных клеток помещается внутри.",
    tasks:[
      {q:"Квадрат со стороной 6 см. Каков его периметр?", type:"number", answer:24, hint:"У квадрата 4 равные стороны: 6 × 4", explain:"6 × 4 = 24 см. Периметр квадрата = сторона × 4."},
      {q:"Прямоугольник 5 см × 3 см. Какова площадь?", type:"number", answer:15, hint:"Площадь = длина × ширина.", explain:"5 × 3 = 15 см². Площадь измеряется в квадратных сантиметрах."},
      {q:"Каков периметр прямоугольника 8 см × 2 см?", type:"number", answer:20, hint:"Сложи все четыре стороны: 8+2+8+2", explain:"(8 + 2) × 2 = 20 см."},
      {q:"Площадь квадрата со стороной 4 см?", type:"number", answer:16, hint:"Сторона × сторону.", explain:"4 × 4 = 16 см²."}
    ]
  },
  {
    id:9, icon:"🚲", title:"Скорость, время, путь",
    intro:"Главная формула: путь = скорость × время. А время = путь : скорость. Не забудь перевести минуты в часы!",
    tasks:[
      {q:"Велосипед едет со скоростью 12 км/ч 2 часа. Какой путь он проехал?", type:"number", answer:24, hint:"12 × 2", explain:"12 × 2 = 24 км."},
      {q:"Идём пешком со скоростью 4 км/ч. За сколько часов пройдём 12 км?", type:"number", answer:3, hint:"12 : 4", explain:"12 : 4 = 3 часа."},
      {q:"Поезд идёт 60 км/ч. Сколько километров он пройдёт за 15 минут?", type:"number", answer:15, hint:"15 минут — это четверть часа.", explain:"60 : 4 = 15 км (за 15 минут = 1/4 часа)."},
      {q:"Двое идут навстречу: один 3 км/ч, другой 2 км/ч. Через 1 час встретились. Каким было расстояние между ними?", type:"number", answer:5, hint:"Сложи скорости и умножь на время.", explain:"(3 + 2) × 1 = 5 км. Они сближались со скоростью 5 км/ч."}
    ]
  },
  {
    id:10, icon:"🏆", title:"Финальный квест",
    intro:"Всё, чему ты научился, в одной корзине. Дыши спокойно и считай по шагам — ты справишься!",
    tasks:[
      {q:"9 × 11 = ?", type:"number", answer:99, hint:"9 × 10 + 9", explain:"9 × 11 = 90 + 9 = 99."},
      {q:"2/3 от 27 — это сколько?", type:"number", answer:18, hint:"27 : 3, потом × 2.", explain:"Одна треть = 9, две трети = 18."},
      {q:"(7 + 5) × 3 − 6 = ?", type:"number", answer:30, hint:"Сначала скобка, потом умножение, потом вычитание.", explain:"7+5=12, 12×3=36, 36−6=30."},
      {q:"К числу прибавили 7 и умножили на 2 — получили 30. Какое число было?", type:"number", answer:8, hint:"30 : 2, потом вычти 7.", explain:"30:2=15, 15−7=8. Проверка: (8+7)×2=30 ✅"},
      {q:"Знаменитая цепочка: 1, 1, 2, 3, 5, 8, … какое число следующее?", type:"number", answer:13, hint:"Каждое число — сумма двух предыдущих.", explain:"5 + 8 = 13. Это ряд Фибоначчи!"}
    ]
  }
];

const STORE = "mathQuestProgress_v1";
let progress = {};
try { progress = JSON.parse(localStorage.getItem(STORE)) || {}; } catch(e){ progress = {}; }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(progress)); }catch(e){} }
function starsOf(l){ return Math.min((progress[l.id] && progress[l.id].stars) || 0, l.tasks.length); }
function isDone(l){ return !!(progress[l.id] && progress[l.id].done); }

const $ = id => document.getElementById(id);
const views = {home:$("home"), lesson:$("lesson"), result:$("result")};
function show(view){ Object.values(views).forEach(v=>v.classList.add("hidden")); views[view].classList.remove("hidden"); window.scrollTo({top:0,behavior:"smooth"}); }

/* ---------- home ---------- */
function renderHome(){
  const done = lessons.filter(isDone).length;
  const totalStars = lessons.reduce((s,l)=>s+starsOf(l),0);
  $("progressText").textContent = `Пройдено ${done} из ${lessons.length} уроков · ⭐ ${totalStars}`;
  $("progressBar").style.width = (done/lessons.length*100) + "%";
  $("grid").innerHTML = lessons.map(l=>{
    const st = starsOf(l), doneMark = isDone(l) ? '<span class="badge-done">✓ пройден</span>' : `<span>${"⭐".repeat(st)}${"☆".repeat(l.tasks.length-st)}</span>`;
    return `<button class="lesson-card" data-id="${l.id}">
      <div class="lc-top"><span>${l.icon}</span><span class="lc-num">урок ${l.id}</span></div>
      <div class="lc-title">${l.title}</div>
      <div class="lc-meta"><span>~10 минут · ${l.tasks.length} заданий</span>${doneMark}</div>
    </button>`;
  }).join("");
}
$("grid").addEventListener("click", e=>{
  const card = e.target.closest(".lesson-card");
  if(card) startLesson(Number(card.dataset.id)-1);
});
$("startNext").addEventListener("click", ()=>{
  const next = lessons.findIndex(l=>!isDone(l));
  startLesson(next === -1 ? 0 : next);
});
$("resetBtn").addEventListener("click", ()=>{
  if(confirm("Сбросить все звёзды и пройденные уроки?")){ progress={}; save(); renderHome(); }
});

/* ---------- lesson engine ---------- */
let cur=0, idx=0, correct=0, selected=null, locked=false, timerId=null, deadline=0;
function norm(v){ return String(v).trim().toLowerCase().replace(/ё/g,"е").replace(/[.,!?;:]/g,"").replace(/\s+/g," "); }
function startTimer(){
  clearInterval(timerId);
  deadline = Date.now()+10*60*1000;
  $("timer").classList.remove("late");
  timerId = setInterval(tick, 500);
  tick();
}
function tick(){
  const left = Math.max(0, Math.ceil((deadline-Date.now())/1000));
  const m = String(Math.floor(left/60)).padStart(2,"0"), s = String(left%60).padStart(2,"0");
  $("timer").textContent = `${m}:${s}`;
  if(left <= 120) $("timer").classList.add("late");
  if(left === 0){ clearInterval(timerId); $("timer").textContent = "⏰"; }
}
function stopTimer(){ clearInterval(timerId); }

function startLesson(n){
  cur=n; idx=0; correct=0; selected=null; locked=false;
  const l=lessons[cur];
  $("lessonTitle").textContent = `${l.icon} ${l.title}`;
  $("lessonIntro").textContent = l.intro;
  show("lesson");
  startTimer();
  renderTask();
}
function renderTask(){
  const l=lessons[cur], t=l.tasks[idx];
  selected=null; locked=false;
  $("qnum").textContent = `Задание ${idx+1} из ${l.tasks.length}`;
  $("lessonCounter").textContent = `Урок ${l.id} из ${lessons.length}`;
  $("question").textContent = t.q;
  $("feedback").className = "feedback";
  $("feedback").textContent = "";
  $("checkBtn").textContent = "Проверить";
  $("checkBtn").disabled = false;
  $("dots").innerHTML = l.tasks.map((_,i)=>`<span class="dot ${i<idx?"ok":i===idx?"now":""}"></span>`).join("");
  const area=$("answerArea");
  if(t.type==="choice"){
    area.innerHTML = `<div class="choices">${t.options.map(o=>`<button class="choice" data-value="${o}">${o}</button>`).join("")}</div>`;
  } else {
    area.innerHTML = `<input type="text" id="answerInput" inputmode="decimal" autocomplete="off" placeholder="Впиши ответ">`;
  }
  const existing=$("hintbox"); if(existing) existing.remove();
}
$("answerArea").addEventListener("click", e=>{
  const c=e.target.closest(".choice"); if(!c) return;
  document.querySelectorAll(".choice").forEach(b=>b.classList.remove("selected"));
  c.classList.add("selected");
  selected=c.dataset.value;
});
$("answerArea").addEventListener("keydown", e=>{
  if(e.key==="Enter"){ e.preventDefault(); check(); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !$("lesson").classList.contains("hidden") && e.target.tagName!=="INPUT" && e.target.tagName!=="BUTTON") check();
});

function check(){
  if(locked){ next(); return; }
  const t=lessons[cur].tasks[idx];
  let ok=false;
  if(t.type==="choice"){
    ok = selected !== null && norm(selected)===norm(t.answer);
  } else if(t.type==="number"){
    const raw=($("answerInput")?.value || "").replace(",",".");
    const n=parseFloat(raw);
    ok = !isNaN(n) && Math.abs(n-Number(t.answer))<1e-9;
  } else {
    const raw=$("answerInput")?.value || "";
    const accepted=Array.isArray(t.answer)?t.answer:[t.answer];
    ok = accepted.some(a=>norm(a)===norm(raw));
  }
  const fb=$("feedback");
  if(ok){
    correct++; locked=true;
    fb.className="feedback good";
    fb.textContent="✅ Верно! Молодец!";
    const ex=document.createElement("div");
    ex.className="explain";
    ex.textContent="💡 " + t.explain;
    fb.after(ex);
    $("checkBtn").textContent = idx===lessons[cur].tasks.length-1 ? "Посмотреть результат →" : "Дальше →";
    const inp=$("answerInput"); if(inp) inp.disabled=true;
    document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
  } else {
    fb.className="feedback bad";
    fb.textContent="❌ Пока нет. Попробуй ещё раз — или открой подсказку 👇";
    const h=$("hintBtn"); h.style.animation="none"; void h.offsetWidth; h.style.animation="pulse .6s";
  }
}
$("hintBtn").addEventListener("click", ()=>{
  if($("hintbox")) return;
  const box=document.createElement("div");
  box.id="hintbox"; box.className="hintbox";
  box.textContent="💡 Подсказка: " + lessons[cur].tasks[idx].hint;
  $("feedback").after(box);
});
$("checkBtn").addEventListener("click", check);
$("backBtn").addEventListener("click", ()=>{ stopTimer(); renderHome(); show("home"); });

function next(){
  const l=lessons[cur];
  document.querySelectorAll(".explain").forEach(e=>e.remove());
  const h=$("hintbox"); if(h) h.remove();
  if(idx < l.tasks.length-1){ idx++; renderTask(); }
  else finish();
}
function finish(){
  stopTimer();
  const l=lessons[cur];
  const old=progress[l.id]||{stars:0,done:false,time:null};
  progress[l.id]={done:true, stars:Math.max(old.stars||0,correct), time:old.time||Math.round((Date.now()-(deadline-10*60*1000))/1000)};
  save();
  const totalStars=lessons.reduce((s,x)=>s+starsOf(x),0);
  const allDone=lessons.every(isDone);
  $("resultIcon").textContent = allDone ? "🎉" : "🏆";
  $("resultTitle").textContent = allDone ? "Все 10 уроков пройдены!" : "Урок пройден!";
  $("resultStars").textContent = "⭐".repeat(correct) + "☆".repeat(l.tasks.length-correct);
  $("resultText").textContent = correct===l.tasks.length
    ? "Идеально! Все задания решены верно. Ты настоящий математический волшебник!"
    : "Отличная работа! Можно пройти урок ещё раз и собрать все звёзды.";
  const secs=progress[l.id].time;
  $("resultStats").innerHTML = `<div><b>${correct}/${l.tasks.length}</b>верных ответов</div>
    <div><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}</b>время</div>
    <div><b>${totalStars}</b>звёзд всего</div>`;
  $("nextLessonBtn").textContent = allDone ? "Начать сначала ↻" : "Следующий урок →";
  show("result");
  if(correct===l.tasks.length) confetti();
}
$("homeBtn").addEventListener("click", ()=>{ renderHome(); show("home"); });
$("nextLessonBtn").addEventListener("click", ()=>{
  const allDone=lessons.every(isDone);
  if(allDone){ startLesson(0); return; }
  let n=cur+1; while(n<lessons.length && isDone(lessons[n])) n++;
  startLesson(n<lessons.length?n:0);
});

function confetti(){
  const box=document.createElement("div"); box.className="confetti";
  const colors=["#6c5ce7","#ff7ab6","#f5a623","#18a874","#4aa3ff"];
  for(let i=0;i<36;i++){
    const p=document.createElement("i");
    p.style.left=Math.random()*100+"%";
    p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*.5)+"s";
    p.style.animationDuration=(1.8+Math.random()*1.2)+"s";
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(),3500);
}

const style=document.createElement("style");
style.textContent="@keyframes pulse{50%{transform:scale(1.12)}}";
document.head.appendChild(style);

renderHome();
</script>
</body>
</html>
